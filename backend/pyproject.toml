[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for Aishwarya Vijay's portfolio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.15,<2.16",
  "psycopg[binary]>=3.3,<3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<9.2",
  "httpx2>=2.13,<3",
  "ruff>=0.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.seed" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is enforced by `ruff format`.
ignore = ["E501"]
